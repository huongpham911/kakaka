<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>News Studio</title>
    <style>
      body { margin:0; font-family: system-ui, sans-serif; background:#0b0f14; color:#e9eef5; }
      header { padding:12px 16px; background:#10171f; border-bottom:1px solid #1b2632; display:flex; align-items:center; gap:12px; }
      .grid { display:grid; grid-template-columns: 360px 1fr; height: calc(100vh - 54px); }
      .panel { padding:14px; overflow:auto; border-right:1px solid #1b2632; }
      .content { padding:14px; overflow:auto; }
      label { font-size:12px; opacity:.85; }
      input, select, button, textarea { width:100%; margin:6px 0 12px; padding:8px; border-radius:8px; border:1px solid #263545; background:#0f141a; color:#e9eef5; }
      button { background:#2463eb; border:none; cursor:pointer; }
      button:hover { filter:brightness(1.1); }
      .row { display:flex; gap:8px; }
      .row > * { flex:1; }
      .hint { font-size:12px; opacity:.7; margin-bottom:12px; }
      .box { padding:10px; border:1px dashed #2b3b4d; border-radius:10px; margin-bottom:12px;}

      /* Dropzone styles */
      .dropzone {
        position: relative;
        padding:12px;
        border:2px dashed #2b3b4d;
        border-radius:8px;
        margin:6px 0 12px;
        background:#0f141a;
        transition: all 0.2s ease;
        min-height:60px;
        display:flex;
        flex-direction:column;
        gap:6px;
      }
      .dropzone input[type="file"] {
        margin:0;
        padding:6px;
        font-size:13px;
        background:#141a24;
        border:1px solid #1f2a36;
      }
      .dropzone.drag-over {
        border-color:#2463eb;
        background:#0d1520;
        border-style:solid;
        box-shadow: 0 0 0 3px rgba(36,99,235,0.1);
      }
      .drop-hint {
        font-size:11px;
        opacity:0.5;
        text-align:center;
        margin:4px 0 0;
        pointer-events:none;
      }
      .dropzone.drag-over .drop-hint {
        opacity:1;
        color:#2463eb;
        font-weight:500;
      }
      .file-name {
        font-size:12px;
        opacity:0.75;
        padding:4px 8px;
        background:#1a2332;
        border-radius:6px;
        word-break:break-all;
      }

      /* Timeline clips */
      .timeline-clips {
        margin-top:12px;
        display:flex;
        flex-direction:column;
        gap:8px;
        max-height:400px;
        overflow-y:auto;
      }
      .clip-item {
        background:#0d1218;
        border:1px solid #1f2a36;
        border-radius:8px;
        padding:10px;
      }
      .clip-header {
        display:flex;
        align-items:center;
        gap:8px;
        margin-bottom:8px;
      }
      .clip-number {
        font-weight:600;
        color:#2463eb;
        font-size:14px;
        min-width:30px;
      }
      .clip-filename {
        flex:1;
        font-size:12px;
        opacity:0.85;
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
      }
      .clip-actions {
        display:flex;
        gap:4px;
      }
      .btn-sm {
        padding:4px 8px;
        font-size:11px;
        background:#1a2532;
        border:1px solid #263545;
        border-radius:4px;
        color:#e9eef5;
        cursor:pointer;
        transition:all 0.15s;
      }
      .btn-sm:hover:not(:disabled) {
        background:#263545;
        border-color:#2463eb;
      }
      .btn-sm:disabled {
        opacity:0.3;
        cursor:not-allowed;
      }
      .btn-danger {
        background:#3d1a1a;
        border-color:#5a2a2a;
      }
      .btn-danger:hover:not(:disabled) {
        background:#5a2a2a;
        border-color:#d32f2f;
      }
      .clip-controls {
        margin-top:8px;
      }
      .clip-row {
        display:flex;
        gap:8px;
      }
      .clip-row > div {
        flex:1;
      }
      .clip-row label {
        display:block;
        margin-bottom:4px;
      }
      .clip-row input, .clip-row select {
        margin:0;
        width:100%;
      }

      /* Tab Navigation */
      .tabs {
        display:flex;
        gap:4px;
        margin-bottom:12px;
        border-bottom:2px solid #1b2632;
        padding-bottom:0;
      }
      .tab {
        flex:1;
        padding:10px 12px;
        background:transparent;
        border:none;
        border-bottom:2px solid transparent;
        color:#7ea1d6;
        cursor:pointer;
        font-size:13px;
        font-weight:500;
        transition:all 0.2s;
        margin:0 0 -2px 0;
      }
      .tab:hover {
        background:#0d1520;
        color:#e9eef5;
      }
      .tab.active {
        border-bottom-color:#2463eb;
        color:#e9eef5;
        background:#0d1520;
      }

      /* Tab Content */
      .tab-content {
        animation: fadeIn 0.2s ease-in;
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      /* Sections */
      .section {
        margin-bottom:16px;
        padding:12px;
        background:#0d1218;
        border:1px solid #1f2a36;
        border-radius:10px;
      }
      .section-title {
        margin:0 0 12px 0;
        font-size:15px;
        font-weight:600;
        color:#e9eef5;
        padding-bottom:8px;
        border-bottom:1px solid #1b2632;
      }
      .subsection {
        margin-bottom:12px;
      }
      .subsection:last-child {
        margin-bottom:0;
      }

      /* Color input group */
      .color-input-group {
        display:flex;
        align-items:center;
      }
      .color-input-group input[type="text"] {
        flex:1;
        margin:6px 0 12px;
      }
      .color-input-group input[type="color"] {
        width:50px;
        margin:6px 0 12px 4px;
        height:38px;
        cursor:pointer;
      }
    </style>
  </head>
  <body>
    <header><strong>🗞️ News Studio</strong><span class="hint">Logo + Frame + Ticker + BGM/Voice → Export MP4</span></header>
    <div id="root" class="grid"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
